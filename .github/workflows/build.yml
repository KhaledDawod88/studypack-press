name: build sample

on:
  push:
    paths:
      - "content/**"
      - "configs/**"
      - "theme/**"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the footer and preview tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet reportlab pypdf

      - name: Build the study pack
        run: |
          python3 build.py configs/intro-statistics.json --preview-pages 1,3,9 --report

      - uses: actions/upload-artifact@v4
        with:
          name: studypack-intro-statistics
          path: |
            build/*.pdf
            build/*.png
